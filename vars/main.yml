---
install_packages:
  - 'needrestart'
  - 'debian-keyring'
  - 'debian-archive-keyring'
  - 'rsync'
source_url:             'http://deb.debian.org/debian'
symlinks:
  - owner:              'root'
    group:              'root'
    src:                '/dev/null'
    dest:               '/etc/cron.d/armbian-updates'
install_files:
  # This script is available but unused by default.  Adding it to a graphical
  # session startup routine is out of scope.
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'files/bin/required_reboot_reminder'
    dest:               '/usr/local/bin/required_reboot_reminder'
template_files:
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'templates/bin/update_debian.j2'
    dest:               '/usr/local/bin/update_debian'
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                'templates/cron.d/update_debian.j2'
    dest:               '/etc/cron.d/update_debian'
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'templates/bin/update_debian_cronjob.j2'
    dest:               '/usr/local/bin/update_debian_cronjob'
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                'templates/conf/apt.conf.d/00DefaultRelease.j2'
    dest:               '/etc/apt/apt.conf.d/00DefaultRelease'
unattended_upgrade_service:
  - 'unattended-upgrades'
remove_packages:
  - 'unattended-upgrades'
